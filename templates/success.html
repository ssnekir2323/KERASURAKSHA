<!DOCTYPE html>
<html>

<head>

    <title>KERASURAKSHA - SOS Sent</title>

    <style>

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(135deg, #07111f, #123b52);

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            color: white;

        }


        .success-box {

            width: 500px;

            max-width: 90%;

            text-align: center;

            background: rgba(255,255,255,0.1);

            backdrop-filter: blur(15px);

            padding: 45px;

            border-radius: 25px;

            box-shadow: 0 20px 60px rgba(0,0,0,0.4);

        }


        .icon {

            font-size: 70px;

            margin-bottom: 15px;

        }


        h1 {

            font-size: 32px;

        }


        p {

            font-size: 18px;

            opacity: 0.9;

        }


        .home-button {

            display: inline-block;

            margin-top: 25px;

            padding: 14px 25px;

            background: white;

            color: #123b52;

            text-decoration: none;

            border-radius: 10px;

            font-weight: bold;

        }

    </style>

</head>


<body>


<div class="success-box">

    <div class="icon">
        ✅
    </div>


    <h1>
        SOS REQUEST RECEIVED
    </h1>


    <p>
        Your emergency request has been successfully
        recorded in the KERASURAKSHA system.
    </p>


    <p>
        🚑 Rescue teams can view the request
        through the control dashboard.
    </p>


    <a class="home-button" href="/">
        🏠 Return to KERASURAKSHA
    </a>

</div>


</body>

</html>
